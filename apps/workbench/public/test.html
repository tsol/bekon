<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WLYA Test</title>
  <script type="importmap">
  {
    "imports": {
      "vue": "/node_modules/vue/dist/vue.esm-bundler.js"
    }
  }
  </script>
</head>
<body style="background:#0d0d1a; color:#fff; font-family:monospace; padding:20px">
  <div id="app">Loading...</div>
  <script type="module">
    console.log('[test] starting')
    import { createApp, ref } from 'vue'
    console.log('[test] vue imported')
    const app = createApp({
      setup() {
        return () => {
          console.log('[test] render called')
          return { msg: 'Vue 3 works!' }
        }
      }
    })
    console.log('[test] mounting...')
    app.mount('#app')
    console.log('[test] mounted OK')
    document.getElementById('app').innerHTML = '<span style="color:#4caf50">Vue mounted! ✅</span>'
  </script>
</body>
</html>
