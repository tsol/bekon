name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node:
    name: desktop-ui (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

  phone-control-api:
    name: phone-control-api (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/phone-control-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/phone-control-api/package-lock.json

      - run: npm ci
      - run: npm run build

  gradle:
    name: wlya-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run core unit tests
        run: ./gradlew :wlya-core:test --project-cache-dir .gradle-ci

  docker-compose:
    name: wlya-server compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate relay stack compose file
        run: docker compose -f packages/wlya-server/docker-compose.yml config
